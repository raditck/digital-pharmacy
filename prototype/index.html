<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmasi Digital - POS Prototype</title>
<style>
:root{
  --primary:#0d9488; --primary-dark:#0f766e; --primary-soft:#ccfbf1; --primary-ink:#134e4a;
  --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --danger:#dc2626; --warn:#d97706; --ok:#16a34a; --radius:10px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
a{color:var(--primary-dark);text-decoration:none}
svg{display:block}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
.brand h1{font-size:15px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.nav{padding:10px;flex:1}
.nav-group{margin-bottom:8px}
.nav-group-title{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;color:var(--text);cursor:pointer;text-align:left;font-size:13px}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted)}
.nav-item:hover{background:#f8fafc}
.nav-item.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.nav-item.active svg{color:var(--primary-dark)}
.sidebar-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;position:sticky;top:0;z-index:5}
.topbar h2{font-size:16px;display:flex;align-items:center;gap:8px}
.topbar h2 svg{width:18px;height:18px;color:var(--primary-dark)}
.topbar .spacer{flex:1}
.view{padding:20px 22px 60px;max-width:1400px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.page-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.page-head .desc{color:var(--muted);font-size:13px;margin-top:3px;max-width:760px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#f1f5f9}
.btn-icon{padding:6px;border-radius:7px}
.input,select.input,textarea.input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.input:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.search{position:relative;min-width:230px}
.search svg{position:absolute;left:9px;top:8px;width:15px;height:15px;color:var(--muted)}
.search .input{padding-left:30px;width:100%}
.tbl-wrap{overflow:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tbl th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tbody tr:hover{background:#f8fafc}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#f1f5f9;color:var(--muted);white-space:nowrap}
.badge.ok{background:#dcfce7;color:#166534}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.badge.info{background:var(--primary-soft);color:var(--primary-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k svg{width:14px;height:14px}
.stat .v{font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:980px){.grid-2{grid-template-columns:1fr}}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px;padding:14px}
.bar-row{display:grid;grid-template-columns:150px 1fr 76px;gap:8px;align-items:center;font-size:12px}
.bar-track{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:999px}
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
@media(max-width:1000px){.pos{grid-template-columns:1fr}}
.pos-products .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.prod{border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;background:#fff;text-align:left}
.prod:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.prod b{display:block;font-size:12.5px;line-height:1.3;min-height:32px}
.prod .sub{color:var(--muted);font-size:11px;margin:4px 0 6px}
.prod .price{font-weight:700;color:var(--primary-dark);font-size:13px}
.prod .stk{font-size:11px;color:var(--muted)}
.cart{display:flex;flex-direction:column;min-height:420px}
.cart-list{flex:1;overflow:auto;max-height:46vh}
.crow{display:grid;grid-template-columns:1fr 96px 74px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid #f1f5f9}
.crow b{font-size:12.5px;display:block}
.crow small{color:var(--muted);font-size:11px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:22px;height:22px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;line-height:1}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.cart-sum{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px}
.cart-sum .line{display:flex;justify-content:space-between}
.cart-sum .line.total{font-weight:700;font-size:15px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--line)}
.pay .full{grid-column:1/-1}
.empty-cart{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:560px;max-width:100%;box-shadow:0 20px 45px rgba(15,23,42,.25)}
.modal.wide{width:720px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 12px 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field .input{width:100%}
.field .err{color:var(--danger);font-size:11px;margin-top:3px;display:none}
.field.invalid .input{border-color:var(--danger)}
.field.invalid .err{display:block}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.receipt{font:12px/1.45 "Courier New",monospace;color:#000;background:#fff;width:300px;margin:0 auto;padding:10px}
.receipt h4{text-align:center;font-size:14px;margin-bottom:2px}
.receipt .center{text-align:center}
.receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:1px 0;vertical-align:top}
.receipt .r{text-align:right}
#print-area{display:none}
#print-area.measuring{display:block!important;position:absolute;left:-10000px;top:0;visibility:hidden}
@page{size:A4;margin:12mm}
@page receipt{size:80mm 297mm;margin:3mm}
@page receipt58{size:58mm 297mm;margin:2mm}
@media print{
  body{background:#fff}
  .app,.sidebar,.topbar,.toolbar,.overlay{display:none!important}
  #print-area{display:block!important}
  #print-area.measuring{position:static!important;left:auto!important;visibility:visible!important}
  .print-a4{padding:0;font-size:12px;color:#000}
  .print-a4 h2{font-size:16px;margin-bottom:2px}
  .print-a4 .meta{font-size:11px;color:#333;margin-bottom:10px}
  .print-a4 table{width:100%;border-collapse:collapse;margin-top:8px}
  .print-a4 th,.print-a4 td{border:1px solid #999;padding:4px 6px;font-size:11px;text-align:left}
  .print-a4 td.num{text-align:right}
  .print-a4 .sig{display:flex;justify-content:space-between;margin-top:36px;font-size:11px}
  .print-receipt{page:receipt;width:100%;max-width:80mm;margin:0 auto;font:12px/1.4 "Courier New",monospace;color:#000;background:#fff}
  .print-receipt.w58{page:receipt58;max-width:58mm;font-size:11px}
  .print-receipt table{page-break-inside:avoid}
  .print-receipt h4{text-align:center;font-size:14px;margin-bottom:2px}
  .print-receipt .center{text-align:center}
  .print-receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
  .print-receipt table{width:100%;border-collapse:collapse}
  .print-receipt td{padding:1px 0;vertical-align:top}
  .print-receipt .r{text-align:right}
  .print-receipt .label-grid,.label-grid.print-labels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .barcode-label{border:1px solid #999;padding:4px;text-align:center;font-size:9px}
  .barcode-label svg{margin:0 auto}
}
.label-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.barcode-label{border:1px dashed var(--line);border-radius:6px;padding:6px;text-align:center;font-size:10px;color:var(--text)}
.barcode-label svg{margin:2px auto}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>Farmasi Digital</h1>
        <small id="brand-sub">POS Prototype</small>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Main menu"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h2 id="page-title"></h2>
      <div class="spacer"></div>
      <button class="btn" id="lang-toggle" title="Ganti bahasa / Change language"></button>
      <button class="btn" id="print-page" title="Print"></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="overlay hidden" id="overlay"></div>
<div id="print-area"></div>
<script src="app.js"></script>
</body>
</html>
